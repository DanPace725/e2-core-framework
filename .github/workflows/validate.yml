name: Validate Core repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS action context
        required: false
        type: string

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository structure and ORMD envelopes
        run: python tools/validate_repository.py

